name: Build & push ACR image

on:
    schedule:
        # 每天 09:30（Asia/Shanghai）检查上游并重建
        - cron: '30 1 * * *'
    workflow_dispatch:
    push:
        branches: ['V4-china']

permissions:
    contents: write

env:
    REGISTRY: crpi-lpnk80vf9ylap67j.cn-beijing.personal.cr.aliyuncs.com
    IMAGE: docker_repository_lpj/microsoft-rewards-script
    UPSTREAM: chiihero/Microsoft-Rewards-Script
    BRANCH: V4-china

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.BRANCH }}
                  fetch-depth: 0

            # 只有当 fork 是上游的祖先时才快进合并并推回；一旦你在 fork 上有自己的
            # 提交造成分叉，就退回到「按 fork 当前代码构建」，绝不自动改写历史。
            - name: Sync upstream
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '418982825+github-actions[bot]@users.noreply.github.com'
                  git remote add upstream 'https://github.com/${{ env.UPSTREAM }}.git'
                  git fetch -q upstream "$BRANCH"
                  if git merge-base --is-ancestor HEAD "upstream/$BRANCH"; then
                      git merge --ff-only -q "upstream/$BRANCH"
                      git push -q origin "HEAD:refs/heads/$BRANCH"
                      echo "已快进合并上游最新提交"
                  else
                      echo "fork 与上游已分叉或上游无新提交，按 fork 当前代码构建"
                  fi

            - name: Compute tags
              id: tags
              run: |
                  set -euo pipefail
                  VER="$(node -p "require('./package.json').version")"
                  echo "version=$VER" >> "$GITHUB_OUTPUT"
                  echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Set up buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # ACR 个人版无法识别 attestation 生成的 OCI image index
                  # （报 denied: unknown manifest class for application/vnd.oci.empty.v1+json），
                  # 关掉后推送的是单个 Docker v2s2 manifest。
                  provenance: false
                  sbom: false
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE }}:v4-china-${{ steps.tags.outputs.short }}
                  cache-from: type=gha,scope=acr
                  cache-to: type=gha,scope=acr,mode=max
