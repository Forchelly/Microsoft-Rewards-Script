name: Build & push ACR image

on:
    schedule:
        # 每天 09:30（Asia/Shanghai）检查上游并重建
        - cron: '30 1 * * *'
    workflow_dispatch:
    push:
        branches: ['V4-china']

permissions:
    contents: write

env:
    REGISTRY: crpi-lpnk80vf9ylap67j.cn-beijing.personal.cr.aliyuncs.com
    IMAGE: docker_repository_lpj/microsoft-rewards-script
    UPSTREAM: chiihero/Microsoft-Rewards-Script
    BRANCH: V4-china

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.BRANCH }}
                  fetch-depth: 0

            # 同步上游：能合就合（真实的 merge，不只是快进），有冲突就放弃合并、
            # 照旧按 fork 当前代码构建。绝不 force push、绝不改写历史。
            # 注意：fork 上有本工作流自身的提交，因此"仅快进"的条件永不成立，
            # 必须用 merge 才能持续吸收上游更新。
            - name: Sync upstream
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '418982825+github-actions[bot]@users.noreply.github.com'
                  # 直接按 URL fetch，不注册 remote：一次性 runner 上无所谓，但
                  # self-hosted runner 会复用工作目录，git remote add 第二次会撞名退出。
                  git fetch -q 'https://github.com/${{ env.UPSTREAM }}.git' "refs/heads/$BRANCH"
                  if git merge-base --is-ancestor FETCH_HEAD HEAD; then
                      echo "上游无新提交（或已包含在当前代码中），按现状构建"
                  elif git merge --no-edit -q FETCH_HEAD; then
                      echo "已合并上游提交："
                      git log --oneline --no-merges --max-count=20 'HEAD^1..HEAD^2'
                      git push -q origin "HEAD:refs/heads/$BRANCH"
                      echo "已推回 fork"
                  else
                      git merge --abort
                      echo "与上游存在冲突，放弃本次合并；按 fork 当前代码构建"
                  fi

            - name: Compute tags
              id: tags
              run: |
                  set -euo pipefail
                  VER="$(node -p "require('./package.json').version")"
                  echo "version=$VER" >> "$GITHUB_OUTPUT"
                  echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Set up buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # ACR 个人版无法识别 attestation 生成的 OCI image index
                  # （报 denied: unknown manifest class for application/vnd.oci.empty.v1+json），
                  # 关掉后推送的是单个 Docker v2s2 manifest。
                  provenance: false
                  sbom: false
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE }}:v4-china-${{ steps.tags.outputs.short }}
                  cache-from: type=gha,scope=acr
                  cache-to: type=gha,scope=acr,mode=max
